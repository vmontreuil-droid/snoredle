# Genereer het Xcode-project met:  brew install xcodegen && xcodegen generate
# Werknaam "Snoredle" — wijzig APP_NAME en BUNDLE_PREFIX hieronder om te hernoemen.
name: Snoredle
options:
  bundleIdPrefix: be.snoredle
  developmentLanguage: nl
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # vul je Apple Developer Team ID in
    APP_NAME: Snoredle

schemes:
  Snoredle:
    build:
      targets:
        Snoredle: all
        SnoredleTests: [test]
    test:
      targets: [SnoredleTests]
    run:
      config: Debug
    archive:
      config: Release

targets:
  Snoredle:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: SharedWidget
    dependencies:
      - target: SnoredleWatch
      - target: SnoredleWidgets
    entitlements:
      path: iOS/Snoredle.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.be.snoredle]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations: [nl]
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [audio, processing, bluetooth-central]
        NSBluetoothAlwaysUsageDescription: "$(APP_NAME) kan hartslag lezen van je sporthorloge of borstband via Bluetooth."
        NSMicrophoneUsageDescription: "$(APP_NAME) luistert tijdens je slaap om snurken te herkennen. Opnames blijven op je toestel."
        NSHealthShareUsageDescription: "$(APP_NAME) leest hartslag, zuurstofsaturatie en ademhalingsfrequentie om je nachten beter te analyseren."
        NSHealthUpdateUsageDescription: "$(APP_NAME) kan slaapanalyse opslaan in Gezondheid."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        BGTaskSchedulerPermittedIdentifiers: [be.snoredle.analysis]
        NSAlarmKitUsageDescription: "$(APP_NAME) gebruikt de wekker om je 's ochtends te wekken, ook in stille modus."
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: "Met Face ID vergrendel je Snoredle, zodat anderen je nachten en opnames niet zien."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.snoredle.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"   # alleen iPhone

  SnoredleWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    entitlements:
      path: Watch/SnoredleWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations: [nl]
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: be.snoredle.app
        WKBackgroundModes: [workout-processing]
        NSMotionUsageDescription: "$(APP_NAME) gebruikt de bewegingssensor om je slaaphouding te bepalen."
        NSHealthShareUsageDescription: "$(APP_NAME) meet je hartslag tijdens de nacht."
        NSHealthUpdateUsageDescription: "$(APP_NAME) start een nachtsessie om metingen te kunnen doen."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.snoredle.app.watchkitapp

  SnoredleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: be.snoredle.app.tests
    dependencies:
      - target: Snoredle

  SnoredleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: SharedWidget
    entitlements:
      path: Widgets/SnoredleWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.be.snoredle]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations: [nl]
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.snoredle.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
