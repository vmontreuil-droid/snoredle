name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Ook naar TestFlight uploaden"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compileren (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Nieuwste Xcode kiezen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Gebruik $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Project genereren
        run: brew install xcodegen && xcodegen generate
      - name: Bouwen
        run: |
          set -o pipefail
          xcodebuild -project Snoredle.xcodeproj -scheme Snoredle \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Foutenlijst
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100
      - name: Tests
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -oE 'iPhone 1[0-9][^(]*' | head -1 | sed 's/ *$//')
          echo "Simulator: $SIM"
          xcodebuild -project Snoredle.xcodeproj -scheme Snoredle \
            -destination "platform=iOS Simulator,name=$SIM" test 2>&1 | grep -E "Test (Case|Suite)|error:|TEST" | tail -40

  testflight:
    name: Naar TestFlight
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.testflight) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]'))
    runs-on: macos-latest
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Nieuwste Xcode kiezen
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Project genereren
        run: brew install xcodegen && xcodegen generate
      - name: App Store Connect-sleutel klaarzetten
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          python3 - <<'PY'
          import os, re, base64
          raw = os.environ.get("P8", "")
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          print("Header aanwezig:", "BEGIN PRIVATE KEY" in raw, "| base64-tekens:", len(body))
          try:
              base64.b64decode(body, validate=True); print("Base64 geldig")
          except Exception as e:
              print("Base64 ONGELDIG:", e)
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          path = os.path.expanduser(f"~/private_keys/AuthKey_{os.environ['ASC_KEY_ID']}.p8")
          open(path, "w").write(pem)
          PY
      - name: Archiveren (automatisch ondertekenen)
        run: |
          xcodebuild -project Snoredle.xcodeproj -scheme Snoredle \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/Snoredle.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID \
            archive
      - name: Controle watch-app in pakket
        run: |
          ls -la "$RUNNER_TEMP/Snoredle.xcarchive/Products/Applications/Snoredle.app/Watch" || echo "::warning::GEEN watch-app in het pakket"
      - name: Uploaden naar App Store Connect / TestFlight
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ci/ExportOptions.plist > $RUNNER_TEMP/ExportOptions.plist
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Snoredle.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID
